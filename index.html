<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyBook - Gestão Profissional</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <header>
        <h1>Beauty<span>Book</span></h1>
        <p>Gestão de Agendamentos</p>
    </header>

    <main>
        <section class="card">
            <h3>✨ Novo Agendamento</h3>
            <div class="services-grid">
                <button onclick="AppAppoint.selecionarServico('Corte de Cabelo', 80)">Corte</button>
                <button onclick="AppAppoint.selecionarServico('Manicure', 50)">Manicure</button>
                <button onclick="AppAppoint.selecionarServico('Escova', 60)">Escova</button>
                <button onclick="AppAppoint.selecionarServico('Design Sobrancelha', 40)">Sobrancelha</button>
            </div>

            <div id="servicoSelecionado" class="status-bar">Selecione um serviço acima</div>

            <div class="form-group">
                <input type="date" id="data">
                <select id="hora">
                    <option value="">Selecione a data primeiro</option>
                </select>
                <button class="btn-confirmar" onclick="AppAppoint.agendar()">Confirmar Horário</button>
            </div>
        </section>

        <section class="card admin-panel">
            <h3>📅 Agenda do Dia</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Serviço</th>
                            <th>Data</th>
                            <th>Hora</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista"></tbody>
                </table>
            </div>
            <div id="total" class="total-faturamento">Total: R$ 0,00</div>
        </section>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
