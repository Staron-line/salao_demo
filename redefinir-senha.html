
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha | BeautyBook</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f5f1ed;
            font-family: 'Poppins', sans-serif;
            color: #604735;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 35px 28px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin: 0 0 8px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 15px 0 6px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #604735;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #mensagem {
            margin-top: 18px;
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
        }

        a {
            color: #604735;
            font-weight: 600;
        }

        .oculto { display: none; }
    </style>
</head>

<body>

<div class="container">
    <h1>BeautyBook</h1>
    <p class="subtitulo">Cadastre uma nova senha para acessar sua conta.</p>

    <div id="carregando">
        Verificando seu link de recuperação...
    </div>

    <form id="formSenha" class="oculto">
        <label for="senha">Nova senha</label>
        <input
            type="password"
            id="senha"
            minlength="6"
            required
            placeholder="Digite sua nova senha"
        >

        <label for="confirmar">Confirme a nova senha</label>
        <input
            type="password"
            id="confirmar"
            minlength="6"
            required
            placeholder="Digite novamente"
        >

        <button type="submit" id="botao">
            Salvar nova senha
        </button>
    </form>

    <div id="mensagem"></div>

    <p style="text-align:center; margin-top:22px; font-size:13px;">
        <a href="login.html">Voltar para o login</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
(async function () {
    const bb = window.beautybookSupabase;

    const carregando = document.getElementById("carregando");
    const form = document.getElementById("formSenha");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("botao");

    if (!bb) {
        carregando.textContent = "Não foi possível conectar ao sistema. Tente novamente.";
        return;
    }

    let sessaoEncontrada = false;

    function liberarFormulario() {
        if (sessaoEncontrada) return;

        sessaoEncontrada = true;
        carregando.classList.add("oculto");
        form.classList.remove("oculto");
    }

    bb.auth.onAuthStateChange((evento, sessao) => {
        if (
            (evento === "PASSWORD_RECOVERY" || evento === "SIGNED_IN") &&
            sessao
        ) {
            liberarFormulario();
        }
    });

    const { data, error } = await bb.auth.getSession();

    if (error) {
        carregando.textContent = "Não foi possível validar o link de recuperação.";
        return;
    }

    if (data.session) {
        liberarFormulario();
    } else {
        setTimeout(() => {
            if (!sessaoEncontrada) {
                carregando.textContent =
                    "Este link é inválido ou expirou. Solicite uma nova recuperação de senha na tela de login.";
            }
        }, 1800);
    }

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const senha = document.getElementById("senha").value;
        const confirmar = document.getElementById("confirmar").value;

        if (senha.length < 6) {
            mensagem.textContent = "A senha deve ter pelo menos 6 caracteres.";
            return;
        }

        if (senha !== confirmar) {
            mensagem.textContent = "As senhas não são iguais.";
            return;
        }

        botao.disabled = true;
        botao.textContent = "Salvando...";
        mensagem.textContent = "";

        const { error } = await bb.auth.updateUser({
            password: senha
        });

        if (error) {
            mensagem.textContent =
                "Não foi possível alterar a senha: " + error.message;
            botao.disabled = false;
            botao.textContent = "Salvar nova senha";
            return;
        }

        await bb.auth.signOut();

        form.classList.add("oculto");
        mensagem.innerHTML =
            "Sua senha foi alterada com sucesso!<br><br>" +
            '<a href="login.html">Clique aqui para entrar no BeautyBook</a>';
    });
})();
</script>

</body>
</html>
