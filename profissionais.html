
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profissionais | BeautyBook</title>
<link rel="stylesheet" href="style.css">

<style>
body {
    background: #f7f2ec;
    color: #604735;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 24px;
}
.container { max-width: 1000px; margin: auto; }
.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 25px;
}
.topo h1 { margin: 0; }
.voltar { color: #604735; text-decoration: none; font-weight: bold; }

.card {
    background: white;
    padding: 24px;
    border-radius: 14px;
    margin-bottom: 22px;
    box-shadow: 0 4px 18px #60473512;
}

.formulario {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}
.campo { display: flex; flex-direction: column; gap: 7px; }
.campo label { font-weight: bold; font-size: 14px; }

.campo input, .campo select {
    padding: 12px;
    border: 1px solid #ddd0c2;
    border-radius: 8px;
    font-size: 15px;
    width: 100%;
    box-sizing: border-box;
}

.campo-completo { grid-column: 1 / -1; }

.botao {
    background: #604735;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
.botao:disabled { opacity: .6; cursor: not-allowed; }

.botao-secundario {
    background: #eee5dc;
    color: #604735;
    border: none;
    padding: 9px 13px;
    border-radius: 7px;
    cursor: pointer;
}

.lista { display: grid; gap: 12px; }

.profissional {
    border: 1px solid #eee5dc;
    padding: 16px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.profissional h3 { margin: 0 0 7px; }
.profissional p { margin: 4px 0; font-size: 14px; }

.status { font-weight: bold; font-size: 13px; }
.ativo { color: #287a4b; }
.inativo { color: #a04465; }

#mensagem { margin-top: 15px; font-size: 14px; }
[hidden] { display: none !important; }

/* Expediente */

.area-expediente {
    width: 100%;
    margin-top: 15px;
    padding-top: 16px;
    border-top: 1px solid #eee5dc;
}

.area-expediente h4 {
    margin: 0 0 8px;
    color: #604735;
}

.expediente-dia {
    display: grid;
    grid-template-columns: 120px 1fr 1fr 1fr 1fr auto;
    gap: 9px;
    align-items: end;
    padding: 12px 0;
    border-bottom: 1px solid #f0e9e2;
}

.expediente-dia:last-child {
    border-bottom: none;
}

.expediente-dia .campo label {
    font-size: 12px;
}

.expediente-dia input[type="time"] {
    width: 100%;
    min-width: 0;
    padding: 9px 6px;
    border: 1px solid #ddd0c2;
    border-radius: 7px;
    box-sizing: border-box;
}

.dia-nome {
    font-weight: bold;
    padding-bottom: 10px;
}

.controle-expediente {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding-bottom: 10px;
}

.controle-expediente input {
    width: 17px;
    height: 17px;
    accent-color: #604735;
}

.mensagem-expediente {
    font-size: 13px;
    margin-top: 12px;
}

.resumo-expediente {
    color: #806d5d;
    font-size: 13px;
    margin-top: 8px;
}

@media (max-width: 750px) {
    .expediente-dia {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 14px 0;
    }

    .dia-nome {
        grid-column: 1 / -1;
        padding-bottom: 0;
    }

    .controle-expediente {
        grid-column: 1 / -1;
        padding-bottom: 0;
    }
}

@media (max-width: 600px) {
    body { padding: 14px; }
    .formulario { grid-template-columns: 1fr; }
    .campo-completo { grid-column: auto; }
    .card { padding: 17px; }
}
    /* Paleta dinâmica BeautyBook */
:root {
    --bb-primary: #C6A56B;
    --bb-secondary: #F1E8D9;
    --bb-accent: #20232C;
    --bb-background: #FAF8F4;
    --bb-surface: #FFFFFF;
    --bb-text: #493A31;
    --bb-muted: #887B70;
    --bb-border: #EADFD5;
}

body {
    background: var(--bb-background);
    color: var(--bb-text);
}

.voltar,
.area-expediente h4 {
    color: var(--bb-accent);
}

.card {
    background: var(--bb-surface);
}

.campo input,
.campo select,
.expediente-dia input[type="time"] {
    background: var(--bb-surface);
    color: var(--bb-text);
    border-color: var(--bb-border);
}

.botao {
    background: var(--bb-primary);
    color: #fff;
}

.botao-secundario {
    background: var(--bb-secondary);
    color: var(--bb-accent);
}

.profissional,
.area-expediente {
    border-color: var(--bb-border);
}

.expediente-dia {
    border-color: var(--bb-border);
}

.controle-expediente input {
    accent-color: var(--bb-primary);
}

.resumo-expediente,
.mensagem-expediente {
    color: var(--bb-muted);
}
    
</style>
</head>

<body>
<div class="container">

    <div class="topo">
        <div>
            <h1>Profissionais</h1>
            <p>Gerencie a equipe do seu salão.</p>
        </div>
        <a class="voltar" href="painel.html">← Voltar ao painel</a>
    </div>

    <section class="card">
        <h2 id="tituloFormulario">Cadastrar profissional</h2>

        <form id="formProfissional">
            <div class="formulario">

                <div class="campo">
                    <label for="nome">Nome *</label>
                    <input id="nome" type="text" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" type="tel">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" type="email">
                </div>

                <div class="campo">
                    <label for="especialidade">Especialidade</label>
                    <input id="especialidade" type="text"
                           placeholder="Ex.: Cabeleireiro">
                </div>

                <div class="campo">
                    <label for="comissao">Comissão (%)</label>
                    <input id="comissao" type="number"
                           min="0" max="100" step="0.01">
                </div>

                <div class="campo">
                    <label for="ativo">Situação</label>
                    <select id="ativo">
                        <option value="true">Ativo</option>
                        <option value="false">Inativo</option>
                    </select>
                </div>

                <div class="campo campo-completo">
                    <button class="botao" id="btnSalvar" type="submit">
                        Salvar profissional
                    </button>

                    <button class="botao-secundario" id="btnCancelar"
                            type="button" hidden>
                        Cancelar edição
                    </button>
                </div>

            </div>
        </form>

        <div id="mensagem"></div>
    </section>

    <section class="card">
        <h2>Equipe cadastrada</h2>

        <div class="formulario" style="margin-bottom:20px;">

            <div class="campo">
                <label for="pesquisaNome">Pesquisar profissional</label>
                <input id="pesquisaNome" type="text"
                       placeholder="Digite o nome...">
            </div>

            <div class="campo">
                <label for="filtroStatus">Filtrar situação</label>
                <select id="filtroStatus">
                    <option value="todos">Todos os profissionais</option>
                    <option value="true">Somente ativos</option>
                    <option value="false">Somente inativos</option>
                </select>
            </div>

        </div>

        <div id="listaProfissionais" class="lista">
            Carregando profissionais...
        </div>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const bb = window.beautybookSupabase;

const form = document.getElementById("formProfissional");
const mensagem = document.getElementById("mensagem");
const lista = document.getElementById("listaProfissionais");
const botaoSalvar = document.getElementById("btnSalvar");
const botaoCancelar = document.getElementById("btnCancelar");

let empresaId = null;
let profissionalEditando = null;
let profissionais = [];
async function carregarPaletaEmpresa() {
    const { data, error } = await bb
        .from("configuracoes_empresa")
        .select("cor_primaria, cor_secundaria, cor_destaque, cor_fundo, paleta")
        .eq("empresa_id", empresaId)
        .maybeSingle();

    if (error) {
        console.error("Erro ao carregar paleta:", error);
        return;
    }

    if (!data) {
        console.warn("Configuração de cores não encontrada. Usando cores padrão.");
        return;
    }

    function corValida(valor, padrao) {
        return /^#[0-9A-Fa-f]{6}$/.test(valor || "")
            ? valor
            : padrao;
    }

    const raiz = document.documentElement;

    raiz.style.setProperty(
        "--bb-primary",
        corValida(data.cor_primaria, "#C6A56B")
    );

    raiz.style.setProperty(
        "--bb-secondary",
        corValida(data.cor_secundaria, "#F1E8D9")
    );

    raiz.style.setProperty(
        "--bb-accent",
        corValida(data.cor_destaque, "#20232C")
    );

    raiz.style.setProperty(
        "--bb-background",
        corValida(data.cor_fundo, "#FAF8F4")
    );

    console.log("Paleta BeautyBook aplicada:", data.paleta);
}    

const diasSemana = [
    "Domingo",
    "Segunda-feira",
    "Terça-feira",
    "Quarta-feira",
    "Quinta-feira",
    "Sexta-feira",
    "Sábado"
];

function mostrarMensagem(texto, sucesso = false) {
    mensagem.style.color = sucesso ? "#287a4b" : "#a04465";
    mensagem.textContent = texto;
}

function limparFormulario() {
    form.reset();
    profissionalEditando = null;

    document.getElementById("tituloFormulario").textContent =
        "Cadastrar profissional";

    botaoSalvar.textContent = "Salvar profissional";
    botaoCancelar.hidden = true;
}

async function iniciar() {
    try {
        const { data: sessaoData, error: erroSessao } =
            await bb.auth.getSession();

        if (erroSessao) throw erroSessao;

        const usuario = sessaoData.session?.user;

        if (!usuario) {
            window.location.replace("login.html");
            return;
        }

        const { data: membro, error: erroMembro } = await bb
            .from("membros_empresa")
            .select("empresa_id")
            .eq("user_id", usuario.id)
            .eq("ativo", true)
            .limit(1)
            .maybeSingle();

        if (erroMembro) throw erroMembro;
        if (!membro) throw new Error("Empresa não encontrada.");

        empresaId = membro.empresa_id;

        await carregarPaletaEmpresa();

        await carregarProfissionais();
    } catch (error) {
        mostrarMensagem("Erro ao carregar: " + error.message);
        lista.textContent = "Não foi possível carregar a equipe.";
    }
}

async function carregarProfissionais() {
    lista.textContent = "Carregando...";

    const { data, error } = await bb
        .from("profissionais")
        .select("*")
        .eq("empresa_id", empresaId)
        .order("nome", { ascending: true });

    if (error) throw error;

    profissionais = data || [];
    aplicarFiltros();
}

function aplicarFiltros() {
    async function gerarAcessoProfissional(profissional, botao) {
    if (!profissional.ativo) {
        mostrarMensagem("Somente profissionais ativos podem receber acesso.");
        return;
    }

    if (profissional.user_id) {
        mostrarMensagem("Esta profissional já possui acesso individual.");
        return;
    }

    const email = prompt(
        "Informe o e-mail que será utilizado por " +
        profissional.nome +
        " para entrar no BeautyBook:"
    );

    if (email === null) return;

    const emailValidado = email.trim().toLowerCase();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValidado)) {
        mostrarMensagem("Informe um endereço de e-mail válido.");
        return;
    }

    const confirmar = confirm(
        "Criar acesso individual para " +
        profissional.nome +
        " usando o e-mail " +
        emailValidado +
        "?"
    );

    if (!confirmar) return;

    botao.disabled = true;
    botao.textContent = "Criando acesso...";

    try {
        const { data, error } = await bb.functions.invoke(
            "gerenciar-acesso-profissional",
            {
                body: {
                    profissional_id: profissional.id,
                    email: emailValidado
                }
            }
        );

        if (error) {
            let detalhe = error.message;

            try {
                const resposta = await error.context.json();
                detalhe = resposta.erro || detalhe;
            } catch (_) {}

            throw new Error(detalhe);
        }

        if (!data || !data.sucesso) {
            throw new Error(
                data?.erro || "Não foi possível criar o acesso."
            );
        }

        const senha = data.senha_provisoria;

        if (!senha) {
            throw new Error(
                "O acesso foi criado, mas a senha provisória não foi retornada. Verifique o painel antes de tentar novamente."
            );
        }

        let resultado =
            "ACESSO CRIADO COM SUCESSO!\n\n" +
            "Profissional: " + profissional.nome + "\n" +
            "E-mail: " + data.email + "\n" +
            "Senha provisória: " + senha + "\n\n" +
            "A profissional deverá trocar a senha no primeiro acesso.";

        if (data.whatsapp_url) {
            resultado +=
                "\n\nClique em OK para abrir o WhatsApp e enviar os dados.";
        } else {
            resultado +=
                "\n\nNão há telefone válido cadastrado. " +
                "Compartilhe os dados de acesso com a profissional por outro meio seguro.";
        }

        alert(resultado);

        if (data.whatsapp_url) {
            window.open(data.whatsapp_url, "_blank");
        }

        mostrarMensagem(
            "Acesso criado para " + profissional.nome + ".",
            true
        );

        await carregarProfissionais();

    } catch (error) {
        mostrarMensagem(
            "Erro ao gerar acesso: " + error.message
        );

        botao.disabled = false;
        botao.textContent = "Gerar acesso profissional";
    }
}
    const pesquisa = document.getElementById("pesquisaNome")
        .value.trim().toLocaleLowerCase("pt-BR");

    const filtro = document.getElementById("filtroStatus").value;

    const filtrados = profissionais.filter(profissional => {
        const nome = (profissional.nome || "")
            .toLocaleLowerCase("pt-BR");

        const combinaNome = nome.includes(pesquisa);

        const combinaStatus =
            filtro === "todos" ||
            String(profissional.ativo) === filtro;

        return combinaNome && combinaStatus;
    });

    lista.innerHTML = "";

    if (filtrados.length === 0) {
        lista.textContent = profissionais.length === 0
            ? "Nenhum profissional cadastrado ainda."
            : "Nenhum profissional encontrado com esses filtros.";
        return;
    }

    filtrados.forEach(profissional => {
        const item = document.createElement("div");
        item.className = "profissional";

        const informacoes = document.createElement("div");

        const nome = document.createElement("h3");
        nome.textContent = profissional.nome;

        const especialidade = document.createElement("p");
        especialidade.textContent =
            "Especialidade: " +
            (profissional.especialidade || "Não informada");

        const telefone = document.createElement("p");
        telefone.textContent =
            "Telefone: " + (profissional.telefone || "Não informado");

        const comissao = document.createElement("p");
        comissao.textContent =
            "Comissão: " + (profissional.percentual_comissao ?? 0) + "%";

        const status = document.createElement("p");
        status.className = "status " +
            (profissional.ativo ? "ativo" : "inativo");

        status.textContent = profissional.ativo ? "Ativo" : "Inativo";

        informacoes.append(nome, especialidade, telefone, comissao, status);

        const acoes = document.createElement("div");
        acoes.style.display = "flex";
        acoes.style.gap = "10px";
        acoes.style.marginTop = "12px";
        acoes.style.flexWrap = "wrap";

        const editar = document.createElement("button");
        editar.className = "botao-secundario";
        editar.textContent = "Editar";

        editar.addEventListener("click", () =>
            editarProfissional(profissional)
        );

        const excluir = document.createElement("button");
        excluir.className = "botao-secundario";
        excluir.textContent = "Excluir";
        excluir.style.background = "#fbe5e5";
        excluir.style.color = "#a04465";

        excluir.addEventListener("click", () =>
            excluirProfissional(profissional)
        );

        const expediente = document.createElement("button");
        expediente.className = "botao-secundario";
        expediente.textContent = "Configurar expediente";

        const areaExpediente = document.createElement("div");
        areaExpediente.className = "area-expediente";
        areaExpediente.hidden = true;

        expediente.addEventListener("click", async () => {
            areaExpediente.hidden = !areaExpediente.hidden;

            if (!areaExpediente.hidden) {
                expediente.textContent = "Fechar expediente";
                await montarExpediente(profissional, areaExpediente);
            } else {
                expediente.textContent = "Configurar expediente";
            }
        });

        acoes.append(editar, excluir, expediente);

       // Botão para gerar acesso individual
const acesso = document.createElement("button");
acesso.className = "botao-secundario";
acesso.textContent = profissional.user_id
    ? "Acesso já criado"
    : "Gerar acesso profissional";

acesso.disabled = !!profissional.user_id || !profissional.ativo;

if (profissional.user_id) {
    acesso.title = "Esta profissional já possui acesso individual.";
}

acesso.addEventListener("click", () => {
    gerarAcessoProfissional(profissional, acesso);
});

acoes.append(editar, excluir, expediente, acesso);

item.append(informacoes, acoes, areaExpediente);
    });
}

async function montarExpediente(profissional, area) {
    area.innerHTML = "Carregando horários...";

    try {
        const { data, error } = await bb
            .from("horarios_trabalho")
            .select("*")
            .eq("empresa_id", empresaId)
            .eq("profissional_id", profissional.id)
            .order("dia_semana", { ascending: true });

        if (error) throw error;

        const horarios = data || [];

        area.innerHTML = "";

        const titulo = document.createElement("h4");
        titulo.textContent = "Horários de expediente — " + profissional.nome;

        const explicacao = document.createElement("p");
        explicacao.className = "resumo-expediente";
        explicacao.textContent =
            "Configure os dias e horários em que esta profissional atende. " +
            "O intervalo é opcional.";

        area.append(titulo, explicacao);

        diasSemana.forEach((dia, indice) => {
            const registro = horarios.find(h => h.dia_semana === indice);

            const linha = document.createElement("div");
            linha.className = "expediente-dia";

            const nomeDia = document.createElement("div");
            nomeDia.className = "dia-nome";
            nomeDia.textContent = dia;

            const campoInicio = criarCampoHora(
                "Início",
                registro?.hora_inicio
            );

            const campoFim = criarCampoHora(
                "Término",
                registro?.hora_fim
            );

            const campoIntervaloInicio = criarCampoHora(
                "Início intervalo",
                registro?.intervalo_inicio
            );

            const campoIntervaloFim = criarCampoHora(
                "Fim intervalo",
                registro?.intervalo_fim
            );

            const controle = document.createElement("label");
            controle.className = "controle-expediente";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = registro ? registro.ativo === true : false;

            const textoAtivo = document.createElement("span");
            textoAtivo.textContent = "Expediente ativo";

            controle.append(checkbox, textoAtivo);

            const botao = document.createElement("button");
            botao.className = "botao-secundario";
            botao.type = "button";
            botao.textContent = "Salvar dia";

            botao.addEventListener("click", async () => {
                await salvarHorario({
                    profissional,
                    diaSemana: indice,
                    registro,
                    ativo: checkbox.checked,
                    inicio: campoInicio.input.value,
                    fim: campoFim.input.value,
                    intervaloInicio: campoIntervaloInicio.input.value,
                    intervaloFim: campoIntervaloFim.input.value,
                    botao,
                    area
                });
            });

            linha.append(
                nomeDia,
                campoInicio.container,
                campoFim.container,
                campoIntervaloInicio.container,
                campoIntervaloFim.container,
                controle,
                botao
            );

            area.appendChild(linha);
        });

        const aviso = document.createElement("div");
        aviso.className = "mensagem-expediente";
        aviso.style.color = "#806d5d";
        aviso.textContent =
            "Salve cada dia separadamente. Dias sem expediente devem permanecer desmarcados.";

        area.appendChild(aviso);

    } catch (error) {
        area.textContent = "Erro ao carregar expediente: " + error.message;
    }
}

function criarCampoHora(rotulo, valor) {
    const container = document.createElement("div");
    container.className = "campo";

    const label = document.createElement("label");
    label.textContent = rotulo;

    const input = document.createElement("input");
    input.type = "time";

    if (valor) {
        input.value = String(valor).slice(0, 5);
    }

    container.append(label, input);

    return { container, input };
}

async function salvarHorario(dados) {
    const {
        profissional,
        diaSemana,
        registro,
        ativo,
        inicio,
        fim,
        intervaloInicio,
        intervaloFim,
        botao,
        area
    } = dados;

    try {
        botao.disabled = true;
        botao.textContent = "Salvando...";

        if (!ativo) {
            if (registro) {
                const { error } = await bb
                    .from("horarios_trabalho")
                    .update({ ativo: false })
                    .eq("id", registro.id)
                    .eq("empresa_id", empresaId)
                    .eq("profissional_id", profissional.id);

                if (error) throw error;
            }

            mostrarMensagem(
                "Expediente desativado para " +
                diasSemana[diaSemana] + ".",
                true
            );

            await montarExpediente(profissional, area);
            return;
        }

        if (!inicio || !fim) {
            throw new Error(
                "Informe o horário de início e término do expediente."
            );
        }

        if (fim <= inicio) {
            throw new Error(
                "O horário de término deve ser posterior ao início."
            );
        }

        if (
            (intervaloInicio && !intervaloFim) ||
            (!intervaloInicio && intervaloFim)
        ) {
            throw new Error(
                "Informe o início e o fim do intervalo."
            );
        }

        if (intervaloInicio && intervaloFim) {
            if (
                intervaloInicio <= inicio ||
                intervaloFim >= fim ||
                intervaloFim <= intervaloInicio
            ) {
                throw new Error(
                    "O intervalo deve estar dentro do expediente e ter horários válidos."
                );
            }
        }

        const dadosHorario = {
            empresa_id: empresaId,
            profissional_id: profissional.id,
            dia_semana: diaSemana,
            hora_inicio: inicio,
            hora_fim: fim,
            intervalo_inicio: intervaloInicio || null,
            intervalo_fim: intervaloFim || null,
            ativo: true
        };

        const { error } = await bb
            .from("horarios_trabalho")
            .upsert(dadosHorario, {
                onConflict: "profissional_id,dia_semana"
            });

        if (error) throw error;

        mostrarMensagem(
            "Expediente de " + diasSemana[diaSemana] +
            " salvo com sucesso!",
            true
        );

        await montarExpediente(profissional, area);

    } catch (error) {
        mostrarMensagem("Erro ao salvar expediente: " + error.message);

        botao.disabled = false;
        botao.textContent = "Salvar dia";
    }
}

document.getElementById("pesquisaNome")
    .addEventListener("input", aplicarFiltros);

document.getElementById("filtroStatus")
    .addEventListener("change", aplicarFiltros);

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!empresaId) {
        mostrarMensagem("Empresa não identificada.");
        return;
    }

    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const email = document.getElementById("email").value.trim();
    const especialidade =
        document.getElementById("especialidade").value.trim();

    const comissaoTexto = document.getElementById("comissao").value;
    const comissao = comissaoTexto === "" ? null : Number(comissaoTexto);
    const ativo = document.getElementById("ativo").value === "true";

    if (!nome) {
        mostrarMensagem("Informe o nome do profissional.");
        return;
    }

    if (comissao !== null &&
        (!Number.isFinite(comissao) || comissao < 0 || comissao > 100)) {
        mostrarMensagem("A comissão deve estar entre 0 e 100.");
        return;
    }

    const dados = {
        nome,
        telefone: telefone || null,
        email: email || null,
        especialidade: especialidade || null,
        percentual_comissao: comissao,
        ativo
    };

    botaoSalvar.disabled = true;
    botaoSalvar.textContent = "Salvando...";

    try {
        let resultado;

        if (profissionalEditando) {
            resultado = await bb
                .from("profissionais")
                .update(dados)
                .eq("id", profissionalEditando)
                .eq("empresa_id", empresaId);
        } else {
            resultado = await bb
                .from("profissionais")
                .insert({
                    ...dados,
                    empresa_id: empresaId
                });
        }

        if (resultado.error) throw resultado.error;

        mostrarMensagem("Profissional salvo com sucesso!", true);

        limparFormulario();
        await carregarProfissionais();

    } catch (error) {
        mostrarMensagem("Erro ao salvar: " + error.message);
    } finally {
        botaoSalvar.disabled = false;
        botaoSalvar.textContent = profissionalEditando
            ? "Salvar alterações"
            : "Salvar profissional";
    }
});

async function excluirProfissional(profissional) {
    const confirmar = confirm(
        "Deseja realmente excluir o profissional " +
        profissional.nome +
        "?\n\nEssa ação não poderá ser desfeita."
    );

    if (!confirmar) return;

    try {
        const { error } = await bb
            .from("profissionais")
            .delete()
            .eq("id", profissional.id)
            .eq("empresa_id", empresaId);

        if (error) throw error;

        mostrarMensagem(
            "Profissional excluído com sucesso!",
            true
        );

        await carregarProfissionais();

    } catch (error) {
        mostrarMensagem(
            "Não foi possível excluir. Verifique se existem agendamentos ou vínculos associados. Detalhe: " +
            error.message
        );
    }
}

function editarProfissional(profissional) {
    profissionalEditando = profissional.id;

    document.getElementById("nome").value = profissional.nome || "";
    document.getElementById("telefone").value = profissional.telefone || "";
    document.getElementById("email").value = profissional.email || "";
    document.getElementById("especialidade").value =
        profissional.especialidade || "";
    document.getElementById("comissao").value =
        profissional.percentual_comissao ?? "";
    document.getElementById("ativo").value = String(profissional.ativo);

    document.getElementById("tituloFormulario").textContent =
        "Editar profissional";

    botaoSalvar.textContent = "Salvar alterações";
    botaoCancelar.hidden = false;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

botaoCancelar.addEventListener("click", limparFormulario);

iniciar();
</script>
